apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: flash-sales-api
        metrics_path: /metrics
        static_configs:
          - targets:
              - flash-sales-api.flash-sales.svc.cluster.local:3000
