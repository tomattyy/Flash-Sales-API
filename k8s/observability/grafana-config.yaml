apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: observability
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.observability.svc.cluster.local:9090
        isDefault: true
        editable: false
  dashboard-provider.yaml: |
    apiVersion: 1
    providers:
      - name: Flash Sales API
        orgId: 1
        folder: Flash Sales API
        type: file
        disableDeletion: true
        editable: false
        options:
          path: /etc/grafana/dashboards
