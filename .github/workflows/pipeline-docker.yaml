name: CI - Container

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "fix/**"
      - "release/**"
      - "hotfix/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container:
    name: Build, Scan and Generate SBOM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Build container image
        run: docker build --tag flash-sales-api:${{ github.sha }} .

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-ref: flash-sales-api:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Generate image SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-ref: flash-sales-api:${{ github.sha }}
          format: cyclonedx
          output: flash-sales-api.sbom.json
          exit-code: "0"
          vuln-type: os,library

      - name: Upload image SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flash-sales-api-sbom
          path: flash-sales-api.sbom.json
          if-no-files-found: error

      - name: Validate release tag belongs to main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use the vMAJOR.MINOR.PATCH format."
            exit 1
          fi

          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "The release tag must point to a commit already merged into main."
            exit 1
          }

      - name: Publish image to Docker Hub
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo "Configure the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets."
            exit 1
          fi

          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

          image="$DOCKERHUB_USERNAME/flash-sales-api"
          sha_tag="sha-${GITHUB_SHA}"
          docker tag "flash-sales-api:${GITHUB_SHA}" "$image:$sha_tag"
          docker push "$image:$sha_tag"

          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            docker tag "flash-sales-api:${GITHUB_SHA}" "$image:latest"
            docker push "$image:latest"
          else
            version="${GITHUB_REF_NAME#v}"
            docker tag "flash-sales-api:${GITHUB_SHA}" "$image:$GITHUB_REF_NAME"
            docker push "$image:$GITHUB_REF_NAME"
            docker tag "flash-sales-api:${GITHUB_SHA}" "$image:$version"
            docker push "$image:$version"
          fi
